name: Remote Product CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/remote-product/**"
      - "packages/contracts/**"
      - "packages/styles/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

  push:
    branches:
      - main
    paths:
      - "apps/remote-product/**"
      - "packages/contracts/**"
      - "packages/styles/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_REMOTE_PRODUCT_PROJECT_ID }}

jobs:
  validate:
    name: Validate Remote Product

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter remote-product lint

      - name: Build
        run: pnpm --filter remote-product build

  deploy:
    name: Deploy Remote Product

    needs:
      - validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Pull Vercel Environment
        run: >
          pnpm dlx vercel@latest pull
          --yes
          --environment=production
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: >
          pnpm dlx vercel@latest build
          --prod
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Production
        run: >
          pnpm dlx vercel@latest deploy
          --prebuilt
          --prod
          --token=${{ secrets.VERCEL_TOKEN }}